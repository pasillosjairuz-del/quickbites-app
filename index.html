<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBites - Campus Eats</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
    .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
    button { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #218838; }
  </style>
</head>
<body>
  <h1>🍔 QuickBites Starter App</h1>
  <p>Welcome! Choose an option below:</p>

  <div class="card">
    <h3>📱 Student Ordering</h3>
    <p>Browse today's menu and order food for pick-up.</p>
    <button onclick="alert('Student Order Flow Coming Soon!')">Go to Student Menu</button>
  </div>

  <div class="card">
    <h3>🏪 Merchant Inventory</h3>
    <p>Add new food items and manage student pick-up orders.</p>
    <button onclick="alert('Merchant Portal Coming Soon!')">Go to Merchant Dashboard</button>
  </div>
</body>
</html>
